<style>
    
        /*set background image for the whole page*/
        body{
            margin: 0;
            height: 100vh;
            background-image:
            url('background.jpg'); /*"C:\Users\YM\Downloads\IMG-20250823-WA0134~2.jpg" */
            background-size: cover; /* makes the image cover the page */
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }
        
    
*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    user-select: none;
}

    
.bg-img::after{
    position: absolute;
    content: '';
    top: 0;
    left: 0;
    height: 100%;
    width: 100%;
    background: rgba(0, 0, 0, 0.2);
}
.content{
    position: absolute;
    top: 50%;
    left: 50%;
    z-index: 999;
    text-align: center;
    padding: 60px 30px;
    width: 370px;
    transform: translate(-50%, -50%);
    background: rgba(255, 255, 255, 0.1);
    box-shadow: -1px 4px 28px 0px rgba(0, 0, 0, 0.75);
}
.content header{
    color: rgb(39, 243, 243);
    font-size: 35px;
    font-weight: 600;
    margin-bottom: 35px;
    font-family: 'montserrat',sans-serif;
}
.fieldinput{
    text-align: center;
}








.login{
    color: white;
    margin: 20px 0px;
    font-family: 'poppins'sans-serif;

}
.links{
    display: flex;
    cursor: pointer;
    color: white;
    margin-bottom: 20px;
}
.facebook, .gmail{
    width: 100px;
    height: 45px;
    line-height: 45px;
    margin-left: 10px;

}
.facebook{
    margin-left: 0;
    background: #043495;
    border: 1px solid #477dea;


}
.gmail{
    background: #e63f3f;

}
.facebook:hover{

}

}
i span{

}
.signup{
    margin-left: 8px;
    font-weight: 500;
    letter-spacing: 1px;
    font-size: 16px;
    font-family: 'poppins',sans-serif;
}
.signup a{
    color: #200eec;
    text-decoration: none;

}
.signup a:hover{
    text-decoration: underline;
}



</style>
